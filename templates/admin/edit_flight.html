{% extends 'admin/base_admin.html' %}
{% block title %}Edit Flight — Admin{% endblock %}
{% block page_title %}Edit Flight {{ flight.flight_number }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-9">
    <div class="data-card">
      <div class="data-card-header">
        <h6><i class="bi bi-pencil-fill me-2" style="color:var(--gold)"></i>Edit Flight — {{ flight.flight_number }}</h6>
        <a href="{{ url_for('admin_flights') }}" class="btn btn-sm btn-navy">← Back</a>
      </div>
      <div class="p-4">
        <form action="{{ url_for('admin_edit_flight', flight_id=flight.id) }}" method="post">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label">Flight Number</label>
              <input type="text" name="flight_number" class="form-control" value="{{ flight.flight_number }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Origin</label>
              <input type="text" name="origin" class="form-control" value="{{ flight.origin }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Destination</label>
              <input type="text" name="destination" class="form-control" value="{{ flight.destination }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Departure Date</label>
              <input type="date" name="departure_date" class="form-control" value="{{ flight.departure_date.strftime('%Y-%m-%d') if flight.departure_date.__class__.__name__ != 'str' else flight.departure_date }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Departure Time</label>
              <input type="time" name="departure_time" class="form-control" value="{{ flight.departure_time.strftime('%H:%M') if flight.departure_time.__class__.__name__ != 'str' else flight.departure_time }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Arrival Time</label>
              <input type="time" name="arrival_time" class="form-control" value="{{ flight.arrival_time.strftime('%H:%M') if flight.arrival_time.__class__.__name__ != 'str' else flight.arrival_time }}" required>
            </div>
            <div class="col-12"><hr style="border-color:#f3f4f6"><p style="font-weight:600;color:var(--navy);font-size:0.875rem">Pricing (₹ per passenger)</p></div>
            <div class="col-md-4">
              <label class="form-label">Economy Price</label>
              <div class="input-group"><span class="input-group-text">₹</span>
              <input type="number" name="economy_price" class="form-control" value="{{ flight.economy_price }}" step="0.01" required></div>
            </div>
            <div class="col-md-4">
              <label class="form-label">Business Price</label>
              <div class="input-group"><span class="input-group-text">₹</span>
              <input type="number" name="business_price" class="form-control" value="{{ flight.business_price }}" step="0.01" required></div>
            </div>
            <div class="col-md-4">
              <label class="form-label">First Class Price</label>
              <div class="input-group"><span class="input-group-text">₹</span>
              <input type="number" name="first_class_price" class="form-control" value="{{ flight.first_class_price }}" step="0.01" required></div>
            </div>
            <div class="col-md-4">
              <label class="form-label">Total Seats</label>
              <input type="number" name="total_seats" class="form-control" value="{{ flight.total_seats }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Available Seats</label>
              <input type="number" name="available_seats" class="form-control" value="{{ flight.available_seats }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Status</label>
              <select name="status" class="form-select">
                {% for s in ['scheduled','delayed','cancelled','completed'] %}
                <option value="{{ s }}" {% if flight.status == s %}selected{% endif %}>{{ s.title() }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-12 mt-3 d-flex gap-3">
              <button type="submit" class="btn btn-gold px-5 py-2" style="font-size:1rem">
                <i class="bi bi-check-lg me-2"></i>Update Flight
              </button>
              <a href="{{ url_for('admin_flights') }}" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
