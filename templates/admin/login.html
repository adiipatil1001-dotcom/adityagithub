<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Kolhapur Airlines</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <style>
    :root { --navy:#0a1628; --gold:#c9a84c; --gold-lt:#e8c96a; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(135deg,#0a1628 0%,#112240 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .login-card {
      background: #fff; border-radius: 24px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.4);
      width: 100%; max-width: 420px; overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, var(--navy), #1a3060);
      padding: 2.5rem; text-align: center;
    }
    .login-body { padding: 2.5rem; }
    .form-control {
      border: 1.5px solid #e5e7eb; border-radius: 10px; padding: 0.75rem 1rem;
    }
    .form-control:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(201,168,76,0.15); }
    .btn-gold {
      background: linear-gradient(135deg,var(--gold),var(--gold-lt));
      color: var(--navy); border: none; border-radius: 30px;
      padding: 0.75rem; font-weight: 700; font-size: 1rem;
    }
    .alert { border-radius: 10px; border: none; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div style="font-size:2.5rem;margin-bottom:0.5rem">🔐</div>
      <div style="font-family:'Playfair Display',serif;color:var(--gold);font-size:1.5rem;font-weight:700">Admin Portal</div>
      <div style="color:rgba(255,255,255,0.5);font-size:0.8rem;margin-top:0.3rem">Kolhapur Airlines Management</div>
    </div>
    <div class="login-body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}{% for cat,msg in messages %}
          <div class="alert alert-{{ cat }} mb-3">{{ msg }}</div>
        {% endfor %}{% endif %}
      {% endwith %}
      <form action="{{ url_for('admin_login') }}" method="post">
        <div class="mb-3">
          <label class="form-label" style="font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:#374151">Username</label>
          <input type="text" name="username" class="form-control" placeholder="admin" required>
        </div>
        <div class="mb-4">
          <label class="form-label" style="font-size:0.8rem;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:#374151">Password</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-gold w-100">
          <i class="bi bi-shield-lock-fill me-2"></i>Access Admin Panel
        </button>
      </form>
      <div class="text-center mt-3">
        <a href="{{ url_for('index') }}" style="color:#9ca3af;font-size:0.8rem;text-decoration:none">← Back to Website</a>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
